<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a href="{{ '/pages/about/' | relative_url }}">About</a>
          <a href="{{ '/pages/public-health-focus/' | relative_url }}">Public Health Focus</a>
          <a href="{{ '/pages/academic-portfolio/' | relative_url }}">Academic Portfolio</a>
          <a href="{{ '/pages/contact/' | relative_url }}">Contact</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>© {{ site.time | date: "%Y" }} {{ site.title }}</small>
      </div>
    </footer>
  </body>
</html>
