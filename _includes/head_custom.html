
<!-- AVATAR_SIZE_OVERRIDE_START -->
<style>
/* Works whether .site-logo is an <img> or a wrapper around <img> */
.site-header .site-logo,
.side-bar   .site-logo {
  display: block !important;
  width: 132px !important;    /* tweak: 112–144px */
  max-width: none !important;
  height: auto !important;
  max-height: none !important;
  border-radius: 12px !important; /* set 0px for square, 50% for circle */
}

/* If the logo lives *inside* a wrapper, size the inner <img> too */
.site-header .site-logo img,
.side-bar   .site-logo img {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  border-radius: inherit !important;
  object-fit: contain !important;   /* no cropping */
  object-position: center center !important;
}
</style>
<!-- AVATAR_SIZE_OVERRIDE_END -->
