
<!-- AVATAR_SIZE_OVERRIDE_START -->
<style>
/* Works whether .site-logo is an <img> or a wrapper around <img> */
.site-header .site-logo,
.side-bar   .site-logo {
  display: block !important;
  width: 132px !important;    /* tweak: 112-144px */
  max-width: none !important;
  height: auto !important;
  max-height: none !important;
  border-radius: 12px !important; /* set 0px for square, 50% for circle */
}

/* If the logo lives *inside* a wrapper, size the inner <img> too */
.site-header .site-logo img,
.side-bar   .site-logo img {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  border-radius: inherit !important;
  object-fit: contain !important;   /* no cropping */
  object-position: center center !important;
}
</style>
<!-- AVATAR_SIZE_OVERRIDE_END -->
<!-- AVATAR_SIZE_SIMPLE_START -->
<style>
/* Works even if the theme doesn’t add a .site-logo class */
.site-title img{
  display:block !important;
  width:144px !important;   /* adjust 128-160px to taste */
  height:auto !important;
  border-radius:12px !important;  /* use 50% for a circle */
}
</style>
<!-- AVATAR_SIZE_SIMPLE_END -->

<!-- Mermaid: robust, self-initializing loader -->
<script id="mermaid-cdn" src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    try {
      if (!window.mermaid) return;
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

      // Convert fenced ```mermaid blocks into renderable <div class="mermaid"> nodes
      document.querySelectorAll('pre > code.language-mermaid').forEach(code => {
        const src = code.textContent.trim();
        const el = document.createElement('div');
        el.className = 'mermaid';
        el.textContent = src;
        code.parentElement.replaceWith(el);
      });

      mermaid.run({ querySelector: '.mermaid' });
    } catch (e) { console.error('Mermaid init failed:', e); }
  });
</script>
