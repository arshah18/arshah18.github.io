title: "Rauf Shah's Digital Portfolio"
description: "MS Bioinformatics | PhD | MPH-Epidemiology Student | UNMC - Lead Health Data Coordinator II; oncology bioinformatics, cancer surveillance, disaster epidemiology; FHIR/HAPI pipelines."

# Theme
remote_theme: just-the-docs/just-the-docs
color_scheme: light
search_enabled: true

# Site URL settings
url: "https://arshah18.github.io"
baseurl: ""

# Enable remote theme plugin (required on GitHub Pages) + pretty permalinks
plugins:
  - jekyll-remote-theme
permalink: pretty

# Navigation - exclude pages from auto-nav to prevent duplicates
nav_exclude:
  - pages/
  - pages/about/
  - pages/academic-portfolio/
  - pages/public-health-focus/
  - pages/contact/
  - pages/surveys/

# Only include these main sections
nav_pages:
  - title: "About"
    url: "/pages/about/"
    nav_order: 2
  - title: "Academic Portfolio"
    url: "/pages/academic-portfolio/"
    nav_order: 3
  - title: "Public Health Focus"
    url: "/pages/public-health-focus/"
    nav_order: 4
  - title: "Contact"
    url: "/pages/contact/"
    nav_order: 5

# Auxiliary links
aux_links:
  "LinkedIn": "https://www.linkedin.com/in/rauf-s-a4634528/"
  "Google Scholar": "https://scholar.google.com/citations?user=Aje0C8AAAAAJ&hl=en"
  "Email": "mailto:abrshah@unmc.edu"

# Favicon
favicon_ico: "/assets/favicon.png"

# Heading anchors
heading_anchors: true

# Just-the-Docs specific
just_the_docs:
  collections:
    pages:
      permalink: "/:path/"
      nav_exclude: true
      output: true

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"