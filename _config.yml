# --- NAV/SEARCH OPTIONS ---
search_enabled: true
aux_links:
  "GitHub":
    - "https://github.com/arshah18"
  "LinkedIn":
    - "https://www.linkedin.com/in/arshah18/"

# Collections for "Updates" (news posts)
collections:
  updates:
    output: true
    permalink: /updates/:path/

# Markdown options (nice tables/footnotes)
kramdown:
  input: GFM
  hard_wrap: false


remote_theme: just-the-docs/just-the-docs@v0.6.2

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
